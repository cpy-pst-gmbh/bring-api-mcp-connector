services:
  bring-mcp:
    build: .
    # Alternativ, wenn du das Image via GitHub Actions baust:
    # image: ghcr.io/DEIN-USER/bring-mcp:latest
    container_name: bring-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- Bring ---
      BRING_USERNAME: "${BRING_USERNAME}"
      BRING_PASSWORD: "${BRING_PASSWORD}"
      BRING_LIST_NAME: "${BRING_LIST_NAME}"
      # --- GitHub OAuth App ---
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      # Öffentliche HTTPS-Adresse dieses Servers, ohne Slash am Ende
      BASE_URL: "${BASE_URL}"
      # Kommaseparierte GitHub-Logins mit Zugriff. Unbedingt setzen!
      ALLOWED_GITHUB_USERS: "${ALLOWED_GITHUB_USERS}"
      LOG_LEVEL: "INFO"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
