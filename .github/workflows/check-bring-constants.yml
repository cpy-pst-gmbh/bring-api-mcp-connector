name: Check Bring constants

# The Symfony side keeps its own copy of Bring!'s base URL and request headers,
# because signing in happens before any MCP token exists. Bumping bring-api can
# move those upstream without anyone noticing, so this fails loudly instead.
on:
  # push is limited to main. Unrestricted, a push to a branch with an open pull
  # request matches both triggers and the check runs twice for one commit.
  push:
    branches: [main]
    paths:
      - "mcp/requirements.txt"
      - "app/.env"
      - "tools/check-bring-constants.py"
      - ".github/workflows/check-bring-constants.yml"
  pull_request:
    paths:
      - "mcp/requirements.txt"
      - "app/.env"
      - "tools/check-bring-constants.py"
      - ".github/workflows/check-bring-constants.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bring-api
        run: pip install -r mcp/requirements.txt

      - name: Compare constants
        run: python tools/check-bring-constants.py
