name: End-to-end tests

# Runs before a merge, against the images that would actually be deployed —
# not a dev server. A red run here means the containers themselves are broken.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Which Bring! the stack talks to. With both secrets present the run goes
      # against the real API, which is the only thing that proves the
      # reverse-engineered protocol still holds; otherwise a stub takes over so
      # the tests behind the login form run anyway instead of skipping.
      - name: Choose the Bring! backend
        env:
          REAL: ${{ secrets.BRING_TEST_EMAIL != '' && secrets.BRING_TEST_PASSWORD != '' }}
        run: |
          if [ "$REAL" = "true" ]; then
            echo 'COMPOSE_FILES=-f docker-compose.yml' >> "$GITHUB_ENV"
            echo '::notice::Running against the real Bring! API.'
          else
            echo 'COMPOSE_FILES=-f docker-compose.yml -f tests/docker-compose.e2e.yml' >> "$GITHUB_ENV"
            echo '::notice::BRING_TEST_EMAIL/PASSWORD are not set — running against the Bring! stub.'
          fi

      - name: Write the environment
        run: |
          cat > .env <<EOF
          BASE_URL="http://127.0.0.1:8000"
          MCP_BASE_URL="http://127.0.0.1:8080"
          BRING_CREDENTIALS_KEY="$(head -c 32 /dev/urandom | base64)"
          APP_SECRET="$(openssl rand -hex 16)"
          OAUTH_PASSPHRASE="$(openssl rand -hex 16)"
          OAUTH_ENCRYPTION_KEY="$(openssl rand -hex 16)"
          TRUSTED_PROXIES="172.16.0.0/12"
          MAILER_DSN="null://null"
          MAIL_FROM="no-reply@localhost"
          PRIVACY_POLICY_URL="legal/privacy.md"
          IMPRINT_URL="legal/imprint.md"
          MAIL_SIGNATURE="legal/signature.md"
          OAUTH_AUDIENCE=""
          CREDENTIALS_CACHE_TTL="900"
          BRING_STUB_EMAIL="stub@example.test"
          BRING_STUB_PASSWORD="stub-password"
          EOF

      # The real documents are operator-specific and stay out of the
      # repository, so the suite gets stand-ins. They have to exist before the
      # containers start: the directory is bind-mounted, and /health fails when
      # a configured document cannot be read.
      - name: Provide stand-in legal documents
        run: |
          mkdir -p legal
          cp docs/privacy-policy.skeleton.md legal/privacy.md
          printf '# Imprint\n\nTest operator, Test street 1, 12345 Test city\n' > legal/imprint.md
          printf '**Test operator** - Test street 1 - 12345 Test city\n' > legal/signature.md

      - name: Build and start
        run: docker compose $COMPOSE_FILES up -d --build

      - name: Wait until both are healthy
        run: |
          for attempt in $(seq 1 60); do
            app=$(curl -fsS http://127.0.0.1:8000/health.json 2>/dev/null || true)
            if [ -n "$app" ] && echo "$app" | grep -q '"status":"ok"'; then
              echo "Both services report healthy."
              echo "$app"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Services did not become healthy."
          curl -sS http://127.0.0.1:8000/health.json || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run the suite
        working-directory: tests
        env:
          APP_BASE_URL: http://127.0.0.1:8000
          MCP_BASE_URL: http://127.0.0.1:8080
          REAL_EMAIL: ${{ secrets.BRING_TEST_EMAIL }}
          REAL_PASSWORD: ${{ secrets.BRING_TEST_PASSWORD }}
        # The stub credentials are written into .env above, so they are defined
        # once for both Compose and the suite rather than repeated here.
        run: |
          set -a
          . ../.env
          set +a
          export BRING_TEST_EMAIL="${REAL_EMAIL:-$BRING_STUB_EMAIL}"
          export BRING_TEST_PASSWORD="${REAL_PASSWORD:-$BRING_STUB_PASSWORD}"
          npx playwright test

      # Both only on failure: the report is the trace worth digging through, and
      # the container logs usually say why something never came up.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Container logs
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color

      - name: Stop
        if: always()
        run: docker compose $COMPOSE_FILES down -v
