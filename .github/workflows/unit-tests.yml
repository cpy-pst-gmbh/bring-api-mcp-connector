name: Unit tests

# The end-to-end suite drives the containers through a browser and says nothing
# about a class in isolation. This one covers the parts with no surface to
# click: the credential cipher, the dormant-account policy, and the pieces that
# have to fail quietly rather than throw.
on:
  # push is limited to main, or a push to a branch with an open pull request
  # matches both triggers and the suite runs twice for one commit.
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # sodium encrypts the stored passwords, pdo_sqlite backs the
          # repository tests. The rest are what composer.json asks for.
          extensions: ctype, iconv, openssl, sodium, pdo_sqlite
          coverage: none

      - name: Install dependencies
        working-directory: app
        # Nothing here boots the kernel, so the post-install scripts — cache
        # warmup, asset install — have no work to do and only add ways to fail.
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Run the suite
        working-directory: app
        run: bin/phpunit
