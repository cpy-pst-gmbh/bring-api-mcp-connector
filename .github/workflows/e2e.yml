name: End-to-end tests

# Runs before a merge, against the images that would actually be deployed —
# not a dev server. A red run here means the containers themselves are broken.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write the environment
        env:
          # Optional. Without it the tests covering everything past the login
          # form skip themselves, because an account only exists once Bring!
          # has confirmed a password.
          BRING_TEST_EMAIL: ${{ secrets.BRING_TEST_EMAIL }}
        run: |
          cat > .env <<EOF
          BASE_URL="http://127.0.0.1:8000"
          MCP_BASE_URL="http://127.0.0.1:8080"
          BRING_CREDENTIALS_KEY="$(head -c 32 /dev/urandom | base64)"
          APP_SECRET="$(openssl rand -hex 16)"
          OAUTH_PASSPHRASE="$(openssl rand -hex 16)"
          OAUTH_ENCRYPTION_KEY="$(openssl rand -hex 16)"
          TRUSTED_PROXIES="172.16.0.0/12"
          MAILER_DSN="null://null"
          MAIL_FROM="no-reply@localhost"
          PRIVACY_POLICY_URL=""
          IMPRINT_URL=""
          OAUTH_AUDIENCE=""
          CREDENTIALS_CACHE_TTL="900"
          EOF
          if [ -n "$BRING_TEST_EMAIL" ]; then
            echo "Authenticated tests will run."
          else
            echo "::notice::BRING_TEST_EMAIL is not set — authenticated tests will be skipped."
          fi

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait until both are healthy
        run: |
          for attempt in $(seq 1 60); do
            app=$(curl -fsS http://127.0.0.1:8000/health.json 2>/dev/null || true)
            if [ -n "$app" ] && echo "$app" | grep -q '"status":"ok"'; then
              echo "Both services report healthy."
              echo "$app"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Services did not become healthy."
          curl -sS http://127.0.0.1:8000/health.json || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run the suite
        working-directory: tests
        env:
          APP_BASE_URL: http://127.0.0.1:8000
          MCP_BASE_URL: http://127.0.0.1:8080
          BRING_TEST_EMAIL: ${{ secrets.BRING_TEST_EMAIL }}
          BRING_TEST_PASSWORD: ${{ secrets.BRING_TEST_PASSWORD }}
        run: npx playwright test

      # Both only on failure: the report is the trace worth digging through, and
      # the container logs usually say why something never came up.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
