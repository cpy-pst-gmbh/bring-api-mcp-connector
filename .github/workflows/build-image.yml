name: Build and push images

on:
  push:
    branches: [main]
    tags: ["v*"]

  # Both Dockerfiles pin a floating base tag, and upstream rebuilds those under
  # the same name whenever a system library is patched. Dependabot only reports
  # a tag that changed, so on its own a rebuilt base never reaches the server:
  # no pull request, no commit, no build. Sunday night, so a fixed image is
  # already there when the Monday dependency updates arrive.
  schedule:
    - cron: "0 3 * * 0"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # Two images from one repository, so each needs its own name. Both build on
    # every push: telling them apart by path would skip the one whose shared
    # files changed.
    strategy:
      fail-fast: false
      matrix:
        component: [app, mcp]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          # The point of the scheduled run. Explicit rather than relying on how
          # buildx happens to resolve a tag it has seen before.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
